name: Build container

on:
  repository_dispatch:
    types:
      - application-release

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/mondoo-engineer

jobs:
  build:
    name: Build and publish container
    runs-on: ubuntu-latest

    steps:
      - name: Check out deployment repository
        uses: actions/checkout@v4

      - name: Download application binary
        env:
          VERSION: ${{ github.event.client_payload.version }}
        run: |
          mkdir -p build

          curl \
            --fail \
            --location \
            --output build/mondoo-engineer-linux-amd64 \
            "https://github.com/${{ github.repository_owner }}/mondoo-engineer-app/releases/download/${VERSION}/mondoo-engineer-linux-amd64"

          chmod +x build/mondoo-engineer-linux-amd64

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build image
        run: |
          docker build \
            --build-arg BINARY=build/mondoo-engineer-linux-amd64 \
            --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.event.client_payload.version }} \
            .

      - name: Push image
        run: |
          docker push \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.event.client_payload.version }}